name: Validate DR Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/validate.yml'

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

# Plans and applies need real cloud identities and are intentionally not executed
# from the public repository workflow.
